[build]
  command = "node --test tests/*.test.mjs"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/*.mjs"
  [headers.values]
    Content-Type = "text/javascript; charset=utf-8"

[[headers]]
  for = "/assets/iphone-duo.glb"
  [headers.values]
    Content-Type = "model/gltf-binary"

[[redirects]]
  from = "/landing"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/landing/"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/landing/index.html"
  to = "/"
  status = 301
  force = true

# Netlify serves /studio/index.html and canonicalizes its directory URL.
